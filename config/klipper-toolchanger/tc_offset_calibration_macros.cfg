#####################################################################
#
#  This file contains the [tool_calibrate] definitions and macros
#  used with Nudge by zruncho
# 
#  github: https://github.com/zruncho3d/nudge
#
#  It uses the tools_calibrate portion of Viesturz
#  klipper-toolchanger add on.
#
#  github: https://github.com/viesturz/klipper-toolchanger
#
#  This file also contains the modified macros and requirements for
#  automatically calibrating the probe position, and tool head
#  gcode offsets for any number of tools defined on the printer.
#
#  github: https://github.com/joseph-greiner/klipper_tc_automatic_offset_calibration
#
#####################################################################
#
#  Instructions:
#
#  This file requires the addition of an offset save file. This is 
#  defined under [tools_calibrate]
#
#  Within the offset_save_file.cfg, add these sections for each tool
#  installed on the printer. t0_xx, t1_xx, t2_xx and on. The macros have been
#  tested to work up to 15 tools.
#    t0_offset_x = 0.0
#    t0_offset_y = 0.0
#    t0_offset_z = 0.0
#    t1_offset_x = 0.0
#    t1_offset_y = 0.0
#    t1_offset_z = 0.0
#
#    If the save file does not have an entry for your tool head, it will error.
#
#####################################################################
#
#  Configuration sections within this file:
#
#      [tools_calibrate]  Parameters for the probe.
#      [save_variables]   Definition for the file to save the offsets to.
#
#  Macros within this file:
#
#      TC_GET_PROBE_POSITION          Gets the position of the probe.
#      TC_FIND_ALL_TOOL_OFFSETS       Find the offsets for all the tools on the printer.
#      TC_FIND_TOOL_OFFSETS           Find the offsets for the specified tool numbers.
#      TC_ADJUST_OFFSET               Adjust a specified offset for a specified tool by a specified amount.
#      _NUDGE_FIND_TOOL_BASELINE      Find the location of the probe vs T0.
#      _NUDGE_MOVE_OVER_PROBE         Moves the tool head over the probe.
#      _TC_SHOW_LAST_RESULT           Shows the last result of tools_calibrate.
#      _TC_SAVE_PROBE_POSITION        Saves the probe position to the save file.
#      _TC_UPDATE_OFFSETS             Saves the offsets to the save file.
#
#####################################################################

[tools_calibrate]
pin: ^gpio4
spread: 2.5
lower_z: 0.2
travel_speed: 100
speed: 2.5
lift_speed: 4
final_lift_z: 4
sample_retract_dist: 2
samples_tolerance: 0.050
samples: 3
samples_result: median
trigger_to_bottom_z: 3

[save_variables]
filename: ~/printer_data/config/offset_save_file.cfg

#####################################################################
#   TC_GET_PROBE_POSITION
#####################################################################

[gcode_macro TC_GET_PROBE_POSITION]
description: Locate the coordinates of the sensor and save to disk. 
gcode:
  {% set hv = printer["gcode_macro homing_variables"] %}
  # Ensure we are using T0 as the reference for the pin location
  T0
  # IMPORTANT: Clear nozzle offsets so we save the pin location relative to the Baseline
  SET_GCODE_OFFSET X=0 Y=0 Z={hv.active_homed_z} MOVE=1
  TOOL_LOCATE_SENSOR
  _TC_SAVE_PROBE_POSITION
  # Restore T0 normal offsets
  T0

#####################################################################
#   TC_FIND_ALL_TOOL_OFFSETS
#####################################################################

[gcode_macro TC_FIND_ALL_TOOL_OFFSETS]
description: Calibrates the offsetts of all tools on the printer.
variable_probe_temp: 150
gcode:
  {% set svf = printer.save_variables.variables %}
  {% set hv = printer["gcode_macro homing_variables"] %}
  {% set num_tools = printer.toolchanger.tool_numbers|length|int %}
  
  {% if "xyz" not in printer.toolhead.homed_axes %}
      RESPOND MSG="Printer must be homed before finding tool offsets."
  {% else %}
      {% for i in range(num_tools) %}
        T{i}
        M109 S{probe_temp} T{i}
        
        # NEUTRALIZE: Keep System Baseline, but clear Tool Offsets for probing
        SET_GCODE_OFFSET X=0 Y=0 Z={hv.active_homed_z} MOVE=1
        
        {% if i == 0 %}
          _NUDGE_FIND_TOOL_BASELINE
          _TC_SHOW_LAST_RESULT
          RESPOND MSG="T0 baseline established."
        {% else %}
          _NUDGE_MOVE_OVER_PROBE
          TOOL_CALIBRATE_TOOL_OFFSET
          _TC_UPDATE_OFFSETS TOOL={i}
        {% endif %}
        
        # Restore tool offsets after probing/saving
        T{i}
        
        {% if printer.idle_timeout.state != "Printing" %}
          M104 S0 T{i}
        {% endif %}
      {% endfor %}
      T0
    {% endif %}

#####################################################################
#   TC_FIND_TOOL_OFFSETS
#####################################################################

[gcode_macro TC_FIND_TOOL_OFFSETS]
description: Calibrates specific tools. Usage: TC_FIND_TOOL_OFFSETS TOOL=1,2
variable_probe_temp: 150
gcode:
  {% set hv = printer["gcode_macro homing_variables"] %}
  {% set tool_nums = "0," + params.TOOL|default("1") %}
  {% set tools_to_adjust = tool_nums.split(",") %}
  
  {% if "xyz" not in printer.toolhead.homed_axes %}
      RESPOND MSG="Printer must be homed before finding tool offsets."
  {% else %}
      {% for i in range(tools_to_adjust|length) %}
        {% set t = tools_to_adjust[i]|int %}
        T{t}
        M109 S{probe_temp} T{t}
        
        # NEUTRALIZE for probing
        SET_GCODE_OFFSET X=0 Y=0 Z={hv.active_homed_z} MOVE=1

        {% if t == 0 %}
          _NUDGE_FIND_TOOL_BASELINE
        {% else %}
          _NUDGE_MOVE_OVER_PROBE
          TOOL_CALIBRATE_TOOL_OFFSET
          _TC_UPDATE_OFFSETS TOOL={t}
        {% endif %}
        
        # RESTORE
        T{t}
      {% endfor %}
      T0
  {% endif %}

#####################################################################
#   TC_ADJUST_OFFSET
#####################################################################
[gcode_macro TC_ADJUST_OFFSET]
description: Adjust an offset. TC_ADJUST_OFFSET TOOL=1 AXIS=X AMOUNT=0.050
gcode:
  {% set tool_num = params.TOOL|default(-1)|int %}
  {% set axis = params.AXIS|default(' ')|lower %}
  {% set amount = params.AMOUNT|default(0.000)|float|round(3) %}
  {% if (tool_num != -1) %}
    {% if (axis == 'x') or (axis == 'y') or (axis == 'z')  %}
      {% if amount != 0.000 %}
        {% set svf = printer.save_variables.variables %}
        {% set var_name = 't' + tool_num|string + '_offset_' + axis %}
        {% set current_val = svf[var_name]|default(0.0)|float %}
        {% set new_val = (current_val + amount)|round(3) %}
        
        SAVE_VARIABLE VARIABLE={var_name} VALUE={new_val}
        RESPOND MSG="T{tool_num} {axis} adjusted: {current_val} -> {new_val}"
        
        {% if printer.toolchanger.tool_number == tool_num %}
          T{tool_num} # Refresh the active tool with the new offset
        {% endif %}
      {% endif %}
    {% endif %}
  {% endif %}

#####################################################################
#   _NUDGE_FIND_TOOL_BASELINE
#####################################################################

[gcode_macro _NUDGE_FIND_TOOL_BASELINE]
gcode:
  _NUDGE_MOVE_OVER_PROBE
  TOOL_LOCATE_SENSOR

#####################################################################
#   _NUDGE_MOVE_OVER_PROBE
#####################################################################

[gcode_macro _NUDGE_MOVE_OVER_PROBE]
gcode:
  {% set svf = printer.save_variables.variables %}
  {% set current_offset_z = printer.gcode_move.homing_origin.z|float %}
  {% set feed = printer['configfile'].config["tools_calibrate"]["travel_speed"]|int * 60  %}
  
  {% if svf.nudge_position_x|default(-1000)|int == -1000 %}
    RESPOND MSG="Nudge position not set. Run TC_GET_PROBE_POSITION first."
  {% else %}
    # Target Logical Z = (Absolute Machine Z) - (Current G-code Offset)
    {% set target_z = svf.nudge_position_z|float - current_offset_z %}
    G0 X{svf.nudge_position_x} Y{svf.nudge_position_y} Z{target_z} F{feed}
  {% endif %}

#####################################################################
#   _TC_SHOW_LAST_RESULT
#####################################################################

[gcode_macro _TC_SHOW_LAST_RESULT]
gcode:
    RESPOND MSG="Last Probe Result -> X: {printer.tools_calibrate.last_x_result|float|round(3)}  Y: {printer.tools_calibrate.last_y_result|float|round(3)} Z: {printer.tools_calibrate.last_z_result|float|round(3)}"

#####################################################################
#   _TC_SAVE_PROBE_POSITION
#####################################################################

[gcode_macro _TC_SAVE_PROBE_POSITION]
description: Update the nudge position from the last probe sequence.
gcode:
    {% set current_offset_z = printer.gcode_move.homing_origin.z|float %}
    
    {% set abs_x = printer.tools_calibrate.last_x_result|float|round(3) %}
    {% set abs_y = printer.tools_calibrate.last_y_result|float|round(3) %}
    # Absolute Z = (Logical Probe Result) + (Current Z Offset)
    {% set abs_z = printer.tools_calibrate.last_z_result|float + current_offset_z %}
    
    SAVE_VARIABLE VARIABLE=nudge_position_x VALUE={abs_x}
    SAVE_VARIABLE VARIABLE=nudge_position_y VALUE={abs_y}
    # Save with 3mm safety margin
    SAVE_VARIABLE VARIABLE=nudge_position_z VALUE={abs_z|round(3) + 3}
    
    RESPOND MSG="Nudge Stored at Machine Z: {abs_z|round(3) + 3}"

#####################################################################
#   _TC_UPDATE_OFFSETS
#####################################################################

[gcode_macro _TC_UPDATE_OFFSETS]
description: Update the offsets gotten from the last probe sequence.
gcode:
    {% set tool_number = params.TOOL|int %}
    {% set last_z = printer.tools_calibrate.last_z_result|float|round(3) %}
    
    # Since we probed with Tool Offsets cleared, the result IS the tool offset
    SAVE_VARIABLE VARIABLE={'t' + tool_number|string + '_offset_x'} VALUE={printer.tools_calibrate.last_x_result|float|round(3)}
    SAVE_VARIABLE VARIABLE={'t' + tool_number|string + '_offset_y'} VALUE={printer.tools_calibrate.last_y_result|float|round(3)}
    SAVE_VARIABLE VARIABLE={'t' + tool_number|string + '_offset_z'} VALUE={last_z}
    
    RESPOND MSG="T{tool_number} Calibrated Offset -> X:{printer.tools_calibrate.last_x_result|float|round(3)} Y:{printer.tools_calibrate.last_y_result|float|round(3)} Z:{last_z}"
    
