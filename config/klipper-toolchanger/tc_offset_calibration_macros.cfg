#  
#  File: tc_offset_calibration_macros.cfg
#  Version: 1.3a
#  Last modification date: March 18, 2026
#  Last modified by: Rob Bricheno (Logic Update: Calibration Neutrality)
#  Heavily based on the macros by Joseph Greiner (r2pdx) available at:
#  https://github.com/joseph-greiner/klipper_tc_automatic_offset_calibration
#
#  r2pdx release notes preserved below for the version from which this forked.
#
#  ==================================================================
#  OFFSET PHILOSOPHY (Work Offset + Tool Offset)
#  ==================================================================
#  This system decouples printer calibration from tool calibration.
#
#  1. GLOBAL BASELINE (t0_probe_z_offset):
#     Stored in the variable file. This is the distance from the 
#     T0 probe trigger point to the T0 nozzle tip. 
#     Set this once. It sets the "True Z" for the whole printer.
#
#  2. T0 IS THE REFERENCE:
#     t0_offset_x, t0_offset_y, and t0_offset_z should always be 0.0.
#     All other tools are calibrated as a 'delta' from T0.
#
#  3. RUNTIME CALCULATION:
#     When picking up a tool, the macro calculates:
#     Total Z = (Global Baseline) + (Tool Offset) + (User Baby-steps)
#
#  4. NUDGE STORAGE:
#     nudge_position_z is stored as a PHYSICAL MACHINE COORDINATE.
#     This ensures the move is safe regardless of active G-code offsets.
#
#  5. CALIBRATION NEUTRALITY:
#     To get an accurate, non-drifting calibration, we must perform the
#     probing while the Tool Nozzle Offsets are ZEROED, but the System
#     Baseline is KEPT.
#
#  Remember to ensure that your t0_offset_x/y/z in offset_save_file.cfg
#  are set to 0.0 before you start, and your t0_probe_z_offset is set
#  to your known good nozzle-to-probe trigger distance (i.e what we
#  used to call z_offset in tool_probe).
#
#####################################################################
#
# Old notes...
