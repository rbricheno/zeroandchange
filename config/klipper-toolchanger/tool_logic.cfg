#####################################################################
#  
#  File: tool_logic.cfg
#  Description: Centralized Offset Engine for zeroandchange.
#  Manages: System Baseline, Tool Deltas, and User Baby-steps.
#
#####################################################################

[gcode_macro _TOOL_STATE]
description: Central state bucket for toolchanger logic.
variable_active_homed_z: 0.0
variable_last_user_tweak: 0.0
gcode:
    # Internal variable storage only

[gcode_macro _INITIALIZE_STATE_FROM_HOMING]
description: Resets tweaks and establishes baseline after a Z-home.
gcode:
    {% set svf = printer.save_variables.variables %}
    # Pull the global baseline from the save file
    {% set baseline = svf.t0_probe_z_offset|default(0.0)|float %}
    
    SET_GCODE_VARIABLE MACRO=_TOOL_STATE VARIABLE=active_homed_z VALUE={baseline}
    SET_GCODE_VARIABLE MACRO=_TOOL_STATE VARIABLE=last_user_tweak VALUE=0.0
    
    # FIX: Resets internal state to 0.0 to ensure a "clean slate" 
    # after homing, preventing old tweaks from polluting new prints.
    RESPOND MSG="Logic: Baseline set to {baseline}, user tweak reset to 0.0"

[gcode_macro _SAVE_CURRENT_TWEAK]
description: Captures the user baby-step before a tool change.
gcode:
  {% set state = printer["gcode_macro _TOOL_STATE"] %}
  {% set svf = printer.save_variables.variables %}
  {% set current_gcode_z = printer.gcode_move.homing_origin.z|float %}
  {% set active_tool = svf.current_tool|default(-1)|int %}

  # We only capture if a tool is loaded and the Z-offset is non-zero
  {% if active_tool >= 0 and current_gcode_z != 0 %}
    {% set system_baseline = state.active_homed_z %}
    {% set tool_z = svf['t' + active_tool|string + '_offset_z']|default(0.0)|float %}
    
    # Tweak = (What is active now) - (What SHOULD be active according to config)
    {% set tweak = current_gcode_z - (system_baseline + tool_z) %}
    
    SET_GCODE_VARIABLE MACRO=_TOOL_STATE VARIABLE=last_user_tweak VALUE={tweak}
    RESPOND MSG="Tweak Captured: {tweak|round(3)}"
  {% else %}
    # If just homed or no tool, tweak is 0.0
    SET_GCODE_VARIABLE MACRO=_TOOL_STATE VARIABLE=last_user_tweak VALUE=0.0
  {% endif %}

[gcode_macro APPLY_TOOL_OFFSETS]
description: Assembles the 3-layer offset: Baseline + Delta + Tweak.
gcode:
  {% set target_tool = params.TOOL|default(printer.toolchanger.tool_number)|int %}
  {% set svf = printer.save_variables.variables %}
  {% set state = printer["gcode_macro _TOOL_STATE"] %}
  
  {% set system_baseline = state.active_homed_z %}
  {% set user_tweak = state.last_user_tweak %}
  
  {% set t_key = 't' + target_tool|string %}
  {% set tool_x = svf[t_key + '_offset_x']|default(0.0)|float|round(3) %}
  {% set tool_y = svf[t_key + '_offset_y']|default(0.0)|float|round(3) %}
  {% set tool_z = svf[t_key + '_offset_z']|default(0.0)|float|round(3) %}
  
  {% set final_z = (system_baseline + tool_z + user_tweak)|round(3) %}
  
  # FIX: Apply offsets with MOVE=1 to ensure the new Z height is 
  # physically respected immediately after the tool change.
  SET_GCODE_OFFSET X={tool_x} Y={tool_y} Z={final_z} MOVE=1
  SAVE_VARIABLE VARIABLE=current_tool VALUE={target_tool}
  
  RESPOND MSG="Active Offset T{target_tool}: X{tool_x} Y{tool_y} Z{final_z} (Tweak:{user_tweak|round(3)})"

[gcode_macro _SELECT_TOOL_WITH_OFFSETS]
description: High-level wrapper for Tx macros to manage state transitions.
gcode:
  {% set target_tool = params.TOOL|int %}
  
  # 1. Capture the baby-step BEFORE clearing offsets
  _SAVE_CURRENT_TWEAK
  
  # 2. Clear for physical transition (Safety)
  SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
  
  # 3. Physical switch (Toolchanger logic)
  SELECT_TOOL T={target_tool}
  
  # 4. Apply new tool offsets + captured tweak
  APPLY_TOOL_OFFSETS TOOL={target_tool}
  
