#####################################################################
#   Homing Overrides
#####################################################################

[homing_override]
axes: xyz
gcode:
    # 1. Track which axes were requested
    {% set X, Y, Z = False, False, False %}
    {% if not 'X' in params and not 'Y' in params and not 'Z' in params %}
        {% set X, Y, Z = True, True, True %}
    {% else %}
        {% if 'X' in params %} {% set X = True %} {% endif %}
        {% if 'Y' in params %} {% set Y = True %} {% endif %}
        {% if 'Z' in params %} {% set Z = True %} {% endif %}
    {% endif %}

    # 2. Safety Check: Toolchanger initialization
    {% if "xyz" not in printer.toolhead.homed_axes %}
        INITIALIZE_TOOLCHANGER
    {% endif %}

    # 3. Perform Homing Sequence
    _HOMING_SEQUENCE_LOGIC X={X} Y={Y} Z={Z}
    
    {% if printer["gcode_macro _sb_vars"] is defined %} STATUS_READY {% endif %}

[gcode_macro _HOMING_SEQUENCE_LOGIC]
description: Physical homing movements.
gcode: 
    {% set X = params.X|lower == 'true' %}
    {% set Y = params.Y|lower == 'true' %}
    {% set Z = params.Z|lower == 'true' %}
    
    # Safe Home Coordinates from printer.cfg
    {% set safe_x = 60 %}
    {% set safe_y = 93.401 %}
    {% set safe_feed = 12000 %}

    # FIX: Only allow homing with T0 to ensure consistent 
    # endstop results and prevent dock crashes.
    {% if printer.toolchanger.tool_number|int == 0 %}
      
      # Z-Lift for safety
      {% if "xyz" not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z=0
        G1 Z10 F2000
      {% endif %}

      # Home Y first (clear of dock magnets)
      {% if Y %}
        {% set y_endstop = printer.configfile.config.stepper_y.position_endstop|float %}
        G28 Y
        G0 Y{y_endstop - 30} F{safe_feed}
      {% endif %}

      # Home X
      {% if X %} G28 X {% endif %}

      # Home Z
      {% if Z %}
        G0 X{safe_x} Y{safe_y} F{safe_feed}
        G28 Z
        
        # 4. Notify Logic Engine to establish baseline and reset tweaks
        _INITIALIZE_STATE_FROM_HOMING
        
        # 5. Apply T0 offsets (Baseline)
        APPLY_TOOL_OFFSETS TOOL=0
      {% endif %}
      
    {% else %}
      RESPOND TYPE=error MSG="Homing must be performed with T0."
      M84
    {% endif %}

#####################################################################
#   Smart Homing
#####################################################################

[gcode_macro SMART_HOMING]
description: Homes the printer only if an axis is currently unhomed.
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="Smart Homing: Axis unhomed, performing G28..."
        G28
    {% else %}
        RESPOND MSG="Smart Homing: All axes homed."
    {% endif %}

    # If your machine had Z_TILT_ADJUST or QUAD_GANTRY_LEVEL,
    # you would add the conditional check (e.g. applied == False) here.
