[include klipper-toolchanger/toolhead_0.cfg]
[include klipper-toolchanger/toolhead_1.cfg]

[include mainsail.cfg]
[include klipper-toolchanger/tool_detection.cfg]
[include klipper-toolchanger/toolchanger.cfg]
[include klipper-toolchanger/toolchanger_macros.cfg]
[include klipper-toolchanger/homing_overrides.cfg]
[include klipper-toolchanger/tc_offset_calibration_macros.cfg]
[include priming.cfg]


[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_45503571278A2D58-if00
restart_method: command

[virtual_sdcard]
path: /home/rob/printer_data/gcodes
on_error_gcode: CANCEL_PRINT


[respond]

[save_variables]
# FIX: Unified path for all macros
filename: ~/printer_data/config/offset_save_file.cfg

# klipper-toolchanger expects this section to be present.
[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 2, 75
mesh_max: 118, 110
probe_count: 3, 3

[force_move]
enable_force_move: true

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 2000
max_z_velocity: 15
max_z_accel: 300
square_corner_velocity: 6.0

#####################################################################
#      X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: gpio11
## Refer to https://docs.vorondesign.com/build/startup/#v0
dir_pin: gpio10                                                     # Check motor direction in link above. If inverted, add a ! before gpio10
enable_pin: !gpio12
#rotation_distance: 40
rotation_distance: 32
microsteps: 64
#full_steps_per_rotation: 200                                        # Set to 400 for 0.9° degree stepper motor, 200 is for 1.8° stepper motors
endstop_pin: EBBCan0: PB6
position_min: -7
position_endstop: 132
position_max: 132
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
interpolate: False
# run_current: 0.0     
run_current: 1.0605       
# you need to calculate the run_current value using the equation (rated_motor_current * 0.707 = Maximum_run_current) start with a value that is about 60%-70% of your maximum value.
sense_resistor: 0.110

[stepper_y]
step_pin: gpio6
## Refer to https://docs.vorondesign.com/build/startup/#v0
dir_pin: gpio5                                                      # Check motor direction in link above. If inverted, add a ! before gpio5
enable_pin: !gpio7
#rotation_distance: 40
rotation_distance: 32
microsteps: 64
#full_steps_per_rotation: 200                                        # Set to 400 for 0.9° degree stepper motor, 200 is for 1.8° stepper motors
endstop_pin: ^gpio3
position_endstop: 102
position_max: 102
position_min: -220
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
interpolate: False
# run_current: 0.0     
run_current: 1.0605       
# you need to calculate the run_current value using the equation (rated_motor_current * 0.707 = Maximum_run_current) start with a value that is about 60%-70% of your maximum value.
sense_resistor: 0.110

#####################################################################
#   Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: gpio19
dir_pin: !gpio28                                                    # Remove the ! before gpio28 if motor direction is inverted.
enable_pin: !gpio2
rotation_distance: 8                                                # For T8x8 integrated lead screw
microsteps: 32
#endstop_pin: ^gpio25
endstop_pin: probe:z_virtual_endstop
#position_endstop: 120
position_max: 120
position_min: -5
homing_speed: 20
second_homing_speed: 3.0
homing_retract_dist: 3.0


[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
interpolate: False
## For OMC (StepperOnline) 17LS13-0404E-200G 0.4A 
#run_current: 0.2
## For LDO-42STH25-1004CL200E 1.0A
#run_current: 0.37
run_current: 0.37
sense_resistor: 0.110
stealthchop_threshold: 0                                            # Set to 999999 to turn stealthchop on, and 0 to use spreadcycle

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: gpio21
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
#sensor_type:
sensor_type: Generic 3950
sensor_pin: gpio26
smooth_time: 3.0
#max_power: 0.6                                                     # Only needed for 100w pads
min_temp: 0
max_temp: 120
control: pid                                                        # Do PID calibration after initial checks
pid_kp: 68.453
pid_ki: 2.749
pid_kd: 426.122

#####################################################################
# Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

## To be used with BED_SCREWS_ADJUST
[bed_screws]
screw1: 60,5
screw1_name: front screw
screw2: 5,115
screw2_name: back left
screw3: 115,115
screw3_name: back right

#####################################################################
# Neopixel
#####################################################################

[neopixel board_rgb]
pin: gpio24
chain_count: 1
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.1
initial_BLUE: 0.0


#####################################################################
#   Nudge probe
#####################################################################

# This is the nudge
[duplicate_pin_override]
pins: gpio4

# This is the nudge
[filament_switch_sensor head1_attached]
switch_pin: ^gpio4
pause_on_runout: false


#####################################################################
#   Print Start
#####################################################################

#print_start tool_0_start={first_layer_temperature[0]} tool_1_start={first_layer_temperature[1]} BED={first_layer_bed_temperature[0]} initial_tool={initial_tool} isT0={is_extruder_used[0]} isT1{is_extruder_used[1]}

[gcode_macro print_start]
gcode:
  RESPOND MSG="Debug: in print start"
  SMART_HOMING
  # Ensure T0 is active for priming start
  T0 
  {% set t0_start = params.TOOL_0_START %}
  {% set t1_start = params.TOOL_1_START %}
  {% set bed_temp = params.BED %}
  {% set t0_used = params.IST0|upper %}
  {% set t1_used = params.IST1|upper %}
  RESPOND MSG="Debug: set variables"
  # Head off tool head heatup to prevent oozing
  {% if t1_used == "TRUE" %}
    M104 S150 T1
  {% endif %}
  RESPOND MSG="Debug: setting T0 temp"
  # Always head off T0, it is the probing tool head.
  M104 S150 T0
  # Make sure bed is at printing temperature, only necessary if the slicer has not sent over the gcode to set the bed temp. prior to calling print_start.
  RESPOND MSG="Debug: setting bed temp"
  M190 S{bed_temp}
  RESPOND MSG="Debug: await temp T0"
  # Make sure T0 is at probing temps before moving forward.
  #yolo
  #M109 S150 T0
  RESPOND MSG="Debug: smart homing"
  # Home the printer if not already done. 
  SMART_HOMING
  RESPOND MSG="Debug: skipping mesh"
  #BED_MESH_CALIBRATE ADAPTIVE=1
  G0 Z40
  # Heat up only the nozzles used to printing temp
  {% if t1_used == "TRUE" %}
    M104 S{t1_start} T1
    {% if t0_used == "TRUE" %}
      M104 S{t0_start} T0
    {% else %}
      M104 S0 T0
      M104 S{t1_start} T1
    {% endif %}
  {% else %}
    M104 S0 T1
    M104 S{t0_start} T0
  {% endif %}
  RESPOND MSG="Debug: ready to prime"
  # Here is wher I prime the used tools and set the first one used as the last one primed.
  # If T1 is used and T0 is the starting tool, prime T1 first.
  {% if t1_used == "TRUE" and params.INITIAL_TOOL|int == 0 %}
    # Switch to T1 and prime
    RESPOND MSG="Priming T1 and T0"
    T1
    PRIME_ACTIVE_TOOL T=1
    T0
    PRIME_ACTIVE_TOOL T=0
  # If T1 is used and T1 is the starting tool
  {% elif t1_used =="TRUE" and params.INITIAL_TOOL|int == 1 %}
    # If T0 is used, prime it first
    {% if t0_used == "TRUE" %}
      RESPOND MSG="Priming T0 and T1"
      T0
      PRIME_ACTIVE_TOOL T=0
      T1
      PRIME_ACTIVE_TOOL T=1
    {% else %}
      # T0 is not used, prime T1 only
      RESPOND MSG="Priming T1"
      T1
      PRIME_ACTIVE_TOOL T=1
    {% endif %}
  {% else %}
    # T1 is NOT used in the print, prime T0 only
    RESPOND MSG="Priming T0"
    T0
    PRIME_ACTIVE_TOOL T=0
  {% endif %}

[gcode_macro print_end]
gcode:
    # Move up by 10mm
    G91
    G0 Z10
    G90
    # Move toolhead to the rear
    G0 Y60
    # Switch to T0
    T0
    # Retract an extra 5mm, try to help oozing
    #G0 E-5
    # Turn off heaters
    TURN_OFF_HEATERS
    # Turn off part fans
    M106 S0

