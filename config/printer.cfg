[include klipper-toolchanger/toolhead_0.cfg]
[include klipper-toolchanger/toolhead_1.cfg]

[include mainsail.cfg]
[include klipper-toolchanger/tool_detection.cfg]
[include klipper-toolchanger/toolchanger.cfg]
[include klipper-toolchanger/toolchanger_macros.cfg]
[include klipper-toolchanger/homing_overrides.cfg]
[include klipper-toolchanger/tool_logic.cfg]
[include klipper-toolchanger/tc_offset_calibration_macros.cfg]
[include priming.cfg]


[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_45503571278A2D58-if00
restart_method: command

[virtual_sdcard]
path: /home/rob/printer_data/gcodes
on_error_gcode: CANCEL_PRINT


[respond]

[save_variables]
# FIX: Unified path for all macros
filename: ~/printer_data/config/offset_save_file.cfg

# klipper-toolchanger expects this section to be present.
[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 2, 75
mesh_max: 118, 110
probe_count: 3, 3

[force_move]
enable_force_move: true

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 2000
max_z_velocity: 15
max_z_accel: 300
square_corner_velocity: 6.0

#####################################################################
#      X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: gpio11
dir_pin: gpio10                                                     
enable_pin: !gpio12
rotation_distance: 32
microsteps: 64
endstop_pin: EBBCan0: PB6
position_min: -7
position_endstop: 132
position_max: 132
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
interpolate: False
run_current: 1.0605       
sense_resistor: 0.110

[stepper_y]
step_pin: gpio6
dir_pin: gpio5                                                      
enable_pin: !gpio7
rotation_distance: 32
microsteps: 64
endstop_pin: ^gpio3
position_endstop: 102
position_max: 102
position_min: -220
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
interpolate: False
run_current: 1.0605       
sense_resistor: 0.110

#####################################################################
#   Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: gpio19
dir_pin: !gpio28                                                    
enable_pin: !gpio2
rotation_distance: 8                                                
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 120
position_min: -5
homing_speed: 20
second_homing_speed: 3.0
homing_retract_dist: 3.0


[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
interpolate: False
run_current: 0.37
sense_resistor: 0.110
stealthchop_threshold: 0                                            

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: gpio21
sensor_type: Generic 3950
sensor_pin: gpio26
smooth_time: 3.0
min_temp: 0
max_temp: 120
control: pid                                                        
pid_kp: 68.453
pid_ki: 2.749
pid_kd: 426.122

#####################################################################
# Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[bed_screws]
screw1: 60,5
screw1_name: front screw
screw2: 5,115
screw2_name: back left
screw3: 115,115
screw3_name: back right

#####################################################################
# Neopixel
#####################################################################

[neopixel board_rgb]
pin: gpio24
chain_count: 1
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.1
initial_BLUE: 0.0


#####################################################################
#   Pin Overrides & Visualization Hacks
#####################################################################

[duplicate_pin_override]
# FIX: Multi-line list for clarity. These pins are independent exemptions.
# gpio4: Shared between [tools_calibrate] (Nudge) and visual sensor hack.
# EBBCan0: PB6: Shared between X endstop, Z probe, and Tool Detection on T0.
pins: 
    gpio4,
    EBBCan0: PB6

# This is a hack to see nudge pin status in Mainsail.
[filament_switch_sensor nudge_sensor_visual]
switch_pin: ^gpio4
pause_on_runout: false


#####################################################################
#   Nudge / Offset Calibration Probe
#####################################################################

[tools_calibrate]
pin: ^gpio4
spread: 2.5
lower_z: 0.2
travel_speed: 100
speed: 2.5
lift_speed: 4
final_lift_z: 4
sample_retract_dist: 2
samples_tolerance: 0.050
samples: 3
samples_result: median
trigger_to_bottom_z: 3


#####################################################################
#   Print Start
#####################################################################

[gcode_macro print_start]
description: Prepares the printer for a multi-tool print job.
gcode:
  # 1. PARAMETER EXTRACTION
  {% set t0_start = params.TOOL_0_START|default(200)|int %}
  {% set t1_start = params.TOOL_1_START|default(200)|int %}
  {% set bed_temp = params.BED|default(60)|int %}
  {% set initial_tool = params.INITIAL_TOOL|default(0)|int %}
  {% set t0_used = params.IST0|default('TRUE')|upper == "TRUE" %}
  {% set t1_used = params.IST1|default('FALSE')|upper == "TRUE" %}

  RESPOND MSG="Print Start: Initializing sequence..."

  # 2. INITIAL HEATING (NON-BLOCKING)
  # Set bed target and pre-heat used tools to standby (150C) to prevent ooze during homing
  M140 S{bed_temp}
  M104 T0 S150
  {% if t1_used %}
    M104 T1 S150
  {% endif %}

  # 3. HOMING & STABILIZATION
  # Always home with T0
  T0 
  SMART_HOMING
  RESPOND MSG="Waiting for bed temperature..."
  M190 S{bed_temp}

  # 4. FINAL TOOL HEATING
  # Set final targets. Unused tools are turned off.
  {% if t0_used %}
    M104 T0 S{t0_start}
  {% else %}
    M104 T0 S0
  {% endif %}

  {% if t1_used %}
    M104 T1 S{t1_start}
  {% else %}
    M104 T1 S0
  {% endif %}

  # 5. SEQUENTIAL PRIMING
  # We prime the tool that is NOT starting first, so the initial tool is clean and ready.
  {% if t0_used and t1_used %}
    {% if initial_tool == 0 %}
      RESPOND MSG="Priming sequence: T1 then T0"
      T1
      _WAIT_FOR_TEMP_WITHIN_TOLERANCE HEATER=extruder1 TOLERANCE=3
      PRIME_ACTIVE_TOOL T=1
      T0
      _WAIT_FOR_TEMP_WITHIN_TOLERANCE HEATER=extruder TOLERANCE=3
      PRIME_ACTIVE_TOOL T=0
    {% else %}
      RESPOND MSG="Priming sequence: T0 then T1"
      T0
      _WAIT_FOR_TEMP_WITHIN_TOLERANCE HEATER=extruder TOLERANCE=3
      PRIME_ACTIVE_TOOL T=0
      T1
      _WAIT_FOR_TEMP_WITHIN_TOLERANCE HEATER=extruder1 TOLERANCE=3
      PRIME_ACTIVE_TOOL T=1
    {% endif %}
  {% elif t0_used %}
    RESPOND MSG="Priming sequence: T0 only"
    T0
    _WAIT_FOR_TEMP_WITHIN_TOLERANCE HEATER=extruder TOLERANCE=3
    PRIME_ACTIVE_TOOL T=0
  {% elif t1_used %}
    RESPOND MSG="Priming sequence: T1 only"
    T1
    _WAIT_FOR_TEMP_WITHIN_TOLERANCE HEATER=extruder1 TOLERANCE=3
    PRIME_ACTIVE_TOOL T=1
  {% endif %}

  RESPOND MSG="Print Start: Priming complete. Commencing print."

[gcode_macro print_end]
gcode:
    # FIX: Prevents nozzle sticking to the print by lifting first
    G91
    G0 Z10 F3000
    G90
    # Move toolhead to the rear for easier access
    G0 Y{printer.configfile.config.stepper_y.position_max|float - 10} F12000
    # Switch to T0 for safety/storage
    T0
    TURN_OFF_HEATERS
    M107 # Turn off all part fans
    M84 # Disable motors

